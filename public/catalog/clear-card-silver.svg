<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#232323"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E8E8" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#A8A8A8" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="metalStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F2F2"/>
      <stop offset="50%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#7A7A7A"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowMetal" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="360" rx="28" fill="url(#bgGlow)"/>
  <ellipse cx="130" cy="60" rx="210" ry="150" fill="#C0C0C0" opacity="0.06"/>

  <g filter="url(#softShadow)">
    <rect x="50" y="85" width="300" height="190" rx="16" fill="url(#glass)"/>
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1">
    <path d="M78 97 L70 263"/>
    <path d="M120 89 L110 271"/>
    <path d="M302 91 L312 269"/>
    <path d="M346 98 L336 262"/>
  </g>
  <path d="M48 178 L352 92 L352 128 L48 224 Z" fill="url(#sheen)" opacity="0.5"/>

  <rect x="50" y="85" width="300" height="190" rx="16" fill="none" stroke="url(#metalStroke)" stroke-width="1.6"/>

  <text x="80" y="130" fill="#F5F5F5" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="2">GoTap</text>
  <text x="81" y="147" fill="#D8D8D8" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="3">SMART NFC CARD</text>
  <line x1="80" y1="157" x2="320" y2="157" stroke="#C0C0C0" stroke-opacity="0.4" stroke-width="1"/>

  <rect x="80" y="232" width="120" height="5" rx="2.5" fill="#F5F5F5" opacity="0.4"/>
  <rect x="80" y="243" width="92" height="4" rx="2" fill="#C0C0C0" opacity="0.6"/>
  <rect x="80" y="253" width="70" height="4" rx="2" fill="#F5F5F5" opacity="0.22"/>

  <g transform="translate(260,182)">
    <rect x="-9" y="-11" width="18" height="22" rx="4" fill="url(#metalStroke)" opacity="0.95" filter="url(#glowMetal)"/>
    <rect x="-5" y="-7" width="10" height="14" rx="2" fill="#0D0D0D" opacity="0.85"/>
    <line x1="0" y1="-4" x2="0" y2="-11" stroke="#D8D8D8" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="0" y1="4" x2="0" y2="11" stroke="#D8D8D8" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M21 -16 Q32 0 21 16" stroke="#C0C0C0" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M32 -26 Q47 0 32 26" stroke="#C0C0C0" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none"/>
    <path d="M43 -36 Q62 0 43 36" stroke="#C0C0C0" stroke-width="1.2" stroke-linecap="round" opacity="0.35" fill="none"/>
  </g>

  <text x="200" y="303" text-anchor="middle" fill="#7d7d7d" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">SILVER CLEAR ACRYLIC · CUSTOM PRINTED</text>
</svg>
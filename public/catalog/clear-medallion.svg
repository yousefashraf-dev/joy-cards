    <circle cx="200" cy="205" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="1.8"/>
  </g>

  <g stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.2">
    <path d="M132 132 L118 276"/>
    <path d="M184 112 L170 296"/>
    <path d="M268 132 L282 276"/>
  </g>
  <path d="M98 205 Q180 120 300 205 L300 205 L98 205 Z" fill="url(#sheen)" opacity="0.4"/>
  <path d="M100 205 C190 120 260 120 300 205 C260 150 200 130 100 205 Z" fill="#FFFFFF" opacity="0.05"/>

  <circle cx="200" cy="112" r="17" fill="url(#bgGlow)"/>

  <circle cx="200" cy="70" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="6"/>
  <circle cx="200" cy="70" r="28" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <g transform="translate(200,205)">
    <rect x="-24" y="-28" width="48" height="38" rx="9" fill="url(#ringGrad)" opacity="0.95" filter="url(#glowGold)"/>
    <rect x="-16" y="-20" width="13" height="22" rx="3" fill="#0D0D0D" opacity="0.9"/>
    <rect x="4" y="-20" width="13" height="22" rx="3" fill="#0D0D0D" opacity="0.9"/>
    <line x1="0" y1="-14" x2="0" y2="-8" stroke="#C6A568" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="6" stroke="#C6A568" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M35 -38 Q48 -20 35 -2" stroke="#C6A568" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M48 -48 Q66 -22 48 4" stroke="#C6A568" stroke-width="1.5" stroke-linecap="round" opacity="0.6" fill="none"/>
  </g>

  <text x="200" y="322" text-anchor="middle" fill="#7d7d7d" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">CLEAR ACRYLIC KEYCHAIN · NFC</text>

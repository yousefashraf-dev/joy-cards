<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#2a2115"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
    <radialGradient id="glassMed" cx="38%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C6A568" stop-opacity="0.10"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4CC94"/>
      <stop offset="50%" stop-color="#C6A568"/>
      <stop offset="100%" stop-color="#9E7D45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="bigShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="360" rx="28" fill="url(#bgGlow)"/>
  <ellipse cx="210" cy="70" rx="210" ry="150" fill="#C6A568" opacity="0.06"/>

  <g filter="url(#bigShadow)">

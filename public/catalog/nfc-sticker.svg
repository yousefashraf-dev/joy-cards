<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#2a2115"/>
      <stop offset="45%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
    <radialGradient id="stickerFace" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="60%" stop-color="#151515"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4CC94"/>
      <stop offset="50%" stop-color="#C6A568"/>
      <stop offset="100%" stop-color="#9E7D45"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="28%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="stickerShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="360" rx="28" fill="url(#bgGlow)"/>
  <ellipse cx="210" cy="70" rx="210" ry="150" fill="#C6A568" opacity="0.06"/>

  <g filter="url(#stickerShadow)" transform="rotate(-5 200 185)">
    <circle cx="200" cy="185" r="112" fill="url(#stickerFace)"/>
    <circle cx="200" cy="185" r="112" fill="none" stroke="url(#ringGrad)" stroke-width="2"/>
    <circle cx="200" cy="185" r="95" fill="none" stroke="#C6A568" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M120 108 Q160 74 205 88 Q246 100 262 132 Q276 168 254 214 Q238 244 206 254 Q160 260 132 224 Q100 186 118 138 Z" fill="url(#gloss)"/>
  </g>

  <g transform="rotate(-5 200 185)">
    <g transform="translate(200,175)">
      <rect x="-24" y="-28" width="48" height="38" rx="8" fill="url(#ringGrad)" opacity="0.95" filter="url(#glowGold)"/>
      <rect x="-15" y="-20" width="12" height="22" rx="3" fill="#0D0D0D" opacity="0.9"/>
      <rect x="3" y="-20" width="12" height="22" rx="3" fill="#0D0D0D" opacity="0.9"/>
      <line x1="0" y1="-14" x2="0" y2="-8" stroke="#C6A568" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#C6A568" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M34 -30 Q44 -18 34 -6" stroke="#C6A568" stroke-width="2" stroke-linecap="round" fill="none"/>
      <path d="M46 -40 Q60 -20 46 0" stroke="#C6A568" stroke-width="1.6" stroke-linecap="round" opacity="0.7" fill="none"/>
      <path d="M58 -50 Q76 -20 58 10" stroke="#C6A568" stroke-width="1.2" stroke-linecap="round" opacity="0.4" fill="none"/>
    </g>

    <g transform="translate(146,218)">
      <rect width="46" height="46" rx="6" fill="#E4CC94" filter="url(#glowGold)"/>
      <g fill="#0D0D0D">
        <rect x="4" y="4" width="12" height="12" rx="2"/>
        <rect x="30" y="4" width="12" height="12" rx="2"/>
        <rect x="4" y="30" width="12" height="12" rx="2"/>
        <rect x="20" y="20" width="8" height="8" rx="1"/>
        <rect x="30" y="30" width="12" height="12" rx="2"/>
        <rect x="20" y="4" width="6" height="6"/>
        <rect x="4" y="20" width="6" height="6"/>
        <rect x="30" y="20" width="4" height="4"/>
        <rect x="20" y="30" width="6" height="6"/>
      </g>
    </g>

    <text x="200" y="250" text-anchor="middle" fill="#C6A568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="3">GoTap · NFC</text>
  </g>

  <g transform="translate(322,84) rotate(-6)">
    <path d="M0 10 C4 0 14 -2 16 6 C18 12 12 20 6 24 C4 26 2 26 0 24 C-4 20 -6 14 -4 9 C-2 4 2 4 2 8 C2 9 1 10 0 10 Z" fill="#4ADE80" opacity="0.85"/>
  </g>
  <text x="352" y="58" text-anchor="middle" fill="#4ADE80" opacity="0.9" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" letter-spacing="1">WATERPROOF</text>

  <text x="200" y="326" text-anchor="middle" fill="#7d7d7d" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="2">NFC + QR · DUAL COMPATIBLE TAG</text>
</svg>